version: '3.8'

services:
  database:
    image: mysql:8.0
    container_name: tilevista-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: tilevista_root_password
      MYSQL_DATABASE: tilevista_db
      MYSQL_USER: tilevista_user
      MYSQL_PASSWORD: tilevista_secure_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: tilevista-backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: "mysql://tilevista_user:tilevista_secure_pass@database:3306/tilevista_db"
      JWT_SECRET: "tilevista_jwt_production_secret_key_change_me"
      JWT_EXPIRATION: "24h"
      NEXT_PUBLIC_API_URL: "http://localhost:4000/api"
    ports:
      - "4000:4000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: "http://localhost:4000/api"
    container_name: tilevista-frontend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  mysql_data:
  uploads_data:
